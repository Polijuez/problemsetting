# meta.yml -- intención de autoría del problema.  Es el único archivo de
# configuración que se edita a mano: init.yml se genera a partir de este.
#
#   model:        preset del problema, uno de los 8 modelos del toolkit.
#   solutionlang: extensión de la solución modelo (.c, .cpp, .hs, .java, .py
#                 y .txt en los modelos output-only).
#   limits:       límites por lenguaje, valores absolutos: tl en segundos y
#                 ml en KiB (la unidad de DMOJ).  Los lenguajes que no
#                 aparezcan usan 2 s / 262144 KiB.
#   grader, checker, batch, io, submission, executor:
#                 overrides opcionales de los ejes del preset.
#
# Los ejes expandidos no se escriben acá: `model:` más los overrides son la
# fuente de verdad y el toolkit los resuelve en cada corrida.
model: signature-batched
solutionlang: .cpp
# `signature-batched` es el modelo `batched` con el grader de firma: el mismo
# enunciado, la misma escalera de subtareas y los mismos límites.  Lo único que
# cambia es *qué* escribe el concursante -- una función contra `signature.hpp`
# en vez de un programa entero -- y eso no toca los límites.
#
# Los dos lenguajes, y por qué no son dos modelos: el grader de firma de DMOJ lo
# aplican tanto el ejecutor de C como el de C++ (`is_signature_gradable`, en
# `dmoj/executors/c_like_executor.py:165-172`), así que **C es una elección de
# lenguaje, no un modelo aparte** -- se elige cambiando `solutionlang: .c`.  Por
# eso la plantilla trae las dos soluciones modelo (`solution.c` y
# `solution.cpp`, la misma solución en dos lenguajes) y por eso los dos límites
# están declarados: el toolkit rechaza un `solutionlang` fuera de `.c`/`.cpp`
# antes de llegar acá, porque ningún otro ejecutor tiene el mecanismo.
#
# `.cpp` y no `.c` como valor por defecto: es el lenguaje que el enunciado
# muestra en su interfaz de ejemplo y el que usa el conjunto de envíos
# declarados, así que es el que un lector espera encontrar.  Va explícito acá
# en vez de deducirse del listado de archivos -- con dos soluciones presentes,
# "el primero que aparece" no diría nada.
#
# La escalera sólo significa algo si el `tl` separa a la lineal (Manacher) de la
# cuadrática sobre los casos de N = 10^5.  Si cambiás el `tl`, los puntajes
# esperados de submissions.yml dejan de valer: corré `problemsetting verify` y
# anotá lo observado en vez de razonarlo.
limits:
  .c:
    tl: 1.0
    ml: 262144
  .cpp:
    tl: 1.0
    ml: 262144
